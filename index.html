<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>太阳系3D探索 | 高精地球 · 无抖动公转 · 平板友好缩放</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
  }
  body {
    background: #000;
    overflow: hidden;
    font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Inter', sans-serif;
    width: 100vw;
    height: 100vh;
    touch-action: pan-x pan-y; 
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    position: fixed;
    top: 0;
    left: 0;
    touch-action: none;
  }

  /* 标题栏 */
  #title {
    position: fixed;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(235, 245, 255, 0.95);
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: 3px;
    text-shadow: 0 0 20px #3e8aff;
    pointer-events: none;
    z-index: 20;
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(8px);
    padding: 5px 24px;
    border-radius: 60px;
    white-space: nowrap;
  }
  @media (max-width: 700px) {
    #title { font-size: 1rem; top: 10px; letter-spacing: 1px; }
    #controls { gap: 10px; padding: 6px 15px; }
    .ctrl-btn { padding: 4px 12px; font-size: 11px; }
    .zoom-slider-container { bottom: 90px; right: 12px; padding: 8px 12px; }
    .zoom-slider-container input { width: 140px; }
  }

  /* 信息卡片 */
  #info-card {
    position: fixed;
    top: 50%;
    right: 20px;
    transform: translateY(-50%);
    background: rgba(5, 15, 30, 0.9);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(70, 170, 255, 0.6);
    border-radius: 28px;
    padding: 20px 24px;
    width: 270px;
    display: none;
    z-index: 25;
    box-shadow: 0 20px 35px rgba(0,0,0,0.6), 0 0 0 1px rgba(100,180,255,0.3);
    transition: all 0.2s;
    color: #eef5ff;
  }
  #info-card h2 { font-size: 26px; color: #ffda9c; margin-bottom: 2px; }
  #info-card .en-name { font-size: 12px; color: #9bc2ff; margin-bottom: 16px; border-left: 2px solid #3e8aff; padding-left: 8px; }
  #info-card .row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid rgba(100, 170, 250, 0.2); font-size: 13px; }
  #info-card-close {
    position: absolute; top: 12px; right: 16px;
    color: #ccdeff; cursor: pointer; font-size: 20px;
    background: rgba(255,255,255,0.05); border-radius: 50%;
    width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
  }
  #info-card-close:hover { background: rgba(255,80,80,0.4); color: white; }

  /* 底部控制栏 */
  #controls {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 16px;
    background: rgba(6, 16, 32, 0.85);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(70, 170, 255, 0.5);
    border-radius: 60px;
    padding: 8px 24px;
    z-index: 20;
    box-shadow: 0 5px 20px rgba(0,0,0,0.5);
  }
  #controls label { color: #c0e4ff; font-size: 13px; font-weight: 500; letter-spacing: 1px; }
  #speed-slider { width: 140px; }
  #speed-val { color: #7dd3fc; font-weight: 600; min-width: 45px; }
  .ctrl-btn {
    background: rgba(30, 80, 150, 0.8);
    border: none;
    color: white;
    border-radius: 40px;
    padding: 5px 16px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: 0.2s;
  }
  .ctrl-btn:hover { background: #2f7bcb; transform: scale(1.02); }
  .mode2d-btn { background: #5a2e8a; box-shadow: 0 0 5px #a05eff; }

  /* 新增：平板友好缩放滑动条（右下角竖直/横向均可，做横向长条） */
  .zoom-slider-container {
    position: fixed;
    bottom: 90px;
    right: 20px;
    background: rgba(6, 16, 32, 0.85);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(70, 170, 255, 0.6);
    border-radius: 40px;
    padding: 8px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 30;
    box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    pointer-events: auto;
  }
  .zoom-slider-container span {
    color: #c0e4ff;
    font-size: 14px;
    font-weight: 500;
  }
  .zoom-slider-container input {
    width: 160px;
    height: 5px;
    -webkit-appearance: none;
    background: #2a4c7a;
    border-radius: 5px;
    outline: none;
    cursor: pointer;
  }
  .zoom-slider-container input::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px;
    height: 20px;
    background: #7dd3fc;
    border-radius: 50%;
    box-shadow: 0 0 8px #3e8aff;
    cursor: pointer;
    border: none;
  }
  .zoom-slider-container input::-webkit-slider-thumb:hover {
    transform: scale(1.15);
  }
  @media (max-width: 700px) {
    .zoom-slider-container { bottom: 85px; right: 12px; padding: 6px 12px; gap: 6px; }
    .zoom-slider-container input { width: 130px; }
    .zoom-slider-container span { font-size: 11px; }
  }

  /* 侧边两列布局 */
  #side-panels {
    position: fixed;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    gap: 16px;
    z-index: 20;
    backdrop-filter: blur(4px);
  }
  .panel {
    background: rgba(5, 12, 25, 0.75);
    backdrop-filter: blur(8px);
    border-radius: 24px;
    border: 1px solid rgba(80, 160, 255, 0.35);
    padding: 14px 12px;
    width: 150px;
    max-height: 70vh;
    overflow-y: auto;
    scrollbar-width: thin;
  }
  .panel h4 {
    color: #9acbff;
    font-size: 13px;
    letter-spacing: 2px;
    margin-bottom: 12px;
    text-align: center;
    border-bottom: 1px solid #3e8aff60;
    display: inline-block;
    width: 100%;
  }
  .planet-btn, .moon-item {
    display: block;
    background: rgba(20, 35, 60, 0.7);
    border: 1px solid rgba(80, 160, 255, 0.3);
    color: #e0f0ff;
    font-size: 12px;
    padding: 6px 10px;
    margin-bottom: 8px;
    border-radius: 40px;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
    font-weight: 500;
  }
  .planet-btn:hover, .moon-item:hover, .active {
    background: #2a6cbe;
    border-color: #a0dcff;
    color: white;
    transform: translateX(4px);
    box-shadow: 0 0 10px #3e8aff;
  }
  .moon-item {
    font-size: 11px;
    margin-left: 6px;
    background: rgba(30, 45, 75, 0.7);
  }
  .panel::-webkit-scrollbar { width: 3px; }
  .panel::-webkit-scrollbar-track { background: #111c30; border-radius: 4px; }
  .panel::-webkit-scrollbar-thumb { background: #3e8aff; border-radius: 4px; }
  #hint {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(180, 210, 255, 0.55);
    font-size: 11px;
    pointer-events: none;
    white-space: nowrap;
    background: rgba(0,0,0,0.3);
    padding: 3px 14px;
    border-radius: 30px;
    z-index: 15;
  }
  #loading {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    background: #030c1ae0;
    padding: 22px 40px;
    border-radius: 32px;
    color: white;
    z-index: 100;
    text-align: center;
    backdrop-filter: blur(12px);
    border: 1px solid #3e8aff;
  }
  .spinner {
    width: 45px; height: 45px;
    border: 3px solid #2a6cbe;
    border-top-color: #9cd4ff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="title">✨ 太阳系 3D | 地球高精渲染 · 平板友好缩放 ✨</div>
<div id="side-panels">
  <div class="panel" id="planets-panel"><h4>🌍 行星</h4><div id="planet-list-container"></div></div>
  <div class="panel" id="moons-panel"><h4>🌙 卫星</h4><div id="moon-list-container"></div></div>
</div>
<div id="info-card">
  <span id="info-card-close">✕</span>
  <h2 id="ic-name"></h2>
  <div class="en-name" id="ic-en"></div>
  <div class="row"><span class="label">直径</span><span class="value" id="ic-diameter"></span></div>
  <div class="row"><span class="label">质量</span><span class="value" id="ic-mass"></span></div>
  <div class="row"><span class="label">公转周期</span><span class="value" id="ic-orbit"></span></div>
  <div class="row"><span class="label">自转周期</span><span class="value" id="ic-rotation"></span></div>
  <div class="row"><span class="label">卫星数</span><span class="value" id="ic-moons"></span></div>
  <div class="row"><span class="label">距太阳</span><span class="value" id="ic-distance"></span></div>
  <div class="row"><span class="label">表面温度</span><span class="value" id="ic-temp"></span></div>
</div>
<div id="controls">
  <label>🌠 公转速度</label>
  <input type="range" id="speed-slider" min="0" max="4.2" step="0.05" value="1.2">
  <span id="speed-val">1.20x</span>
  <button class="ctrl-btn" id="btn-pause">⏸ 暂停</button>
  <button class="ctrl-btn mode2d-btn" id="btn-2d-mode">📐 2D直线视图</button>
  <button class="ctrl-btn" id="btn-reset">🔄 重置视角</button>
</div>

<!-- 独立缩放滑块，方便平板直接操作 -->
<div class="zoom-slider-container" id="zoomSliderContainer">
  <span>🔍 缩放</span>
  <input type="range" id="zoom-slider" min="2.8" max="520" step="0.5" value="175">
</div>

<div id="hint">🖱️ 单指旋转 / 双指缩放 · 点击星球查看详情 | 右侧滑块可精确控制距离</div>
<div id="loading"><div class="spinner"></div>🌌 加载宇宙纹理... 地球高精度渲染启用中</div>
<canvas id="glcanvas"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
(function(){
  if (typeof THREE === 'undefined') {
    document.getElementById('loading').innerHTML = '<div style="color:#ff8888">Three.js 加载失败，请刷新页面</div>';
    return;
  }
  
  // ---------- 行星数据 ----------
  const PLANETS = [
    { name:'水星', en:'Mercury', radius:0.38, distance:12.0, speed:4.74, color:0xbc9a6c, rotSpeed:0.003, tilt:0.034,
      info:{ diameter:'4,879 km', mass:'3.30×10²³ kg', orbit:'88 天', rotation:'59 天', moons:'0', distance:'0.39 AU', temp:'-180 ~ 430°C' } },
    { name:'金星', en:'Venus', radius:0.92, distance:16.8, speed:3.5, color:0xe6c99c, rotSpeed:-0.001, tilt:3.09,
      info:{ diameter:'12,104 km', mass:'4.87×10²⁴ kg', orbit:'225 天', rotation:'243 天', moons:'0', distance:'0.72 AU', temp:'约 465°C' } },
    { name:'地球', en:'Earth', radius:1.05, distance:23.5, speed:2.98, color:0x4a8fe7, rotSpeed:0.01, tilt:0.409,
      moons:[{ name:'月球', radius:0.28, dist:3.0, speed:2.2, color:0xbbbbaa, tilt:0.09 }],
      info:{ diameter:'12,742 km', mass:'5.97×10²⁴ kg', orbit:'365 天', rotation:'24 小时', moons:'1', distance:'1.00 AU', temp:'-88 ~ 58°C' } },
    { name:'火星', en:'Mars', radius:0.58, distance:32.0, speed:2.41, color:0xcf6a2e, rotSpeed:0.009, tilt:0.439,
      moons:[{ name:'火卫一', radius:0.12, dist:1.5, speed:5.8, color:0xbb9a7a },{ name:'火卫二', radius:0.09, dist:2.4, speed:3.5, color:0xaa8877 }],
      info:{ diameter:'6,779 km', mass:'6.39×10²³ kg', orbit:'687 天', rotation:'24.6 小时', moons:'2', distance:'1.52 AU', temp:'-87 ~ -5°C' } },
    { name:'木星', en:'Jupiter', radius:2.9, distance:53.5, speed:1.31, color:0xdda56c, rotSpeed:0.02, tilt:0.054,
      moons:[
        { name:'木卫一·埃奥', radius:0.28, dist:4.8, speed:4.5 },{ name:'木卫二·欧罗巴', radius:0.24, dist:6.2, speed:3.5 },
        { name:'木卫三·盖尼米德', radius:0.38, dist:8.0, speed:2.6 },{ name:'木卫四·卡利斯托', radius:0.35, dist:10.5, speed:1.9 }
      ],
      info:{ diameter:'139,820 km', mass:'1.90×10²⁷ kg', orbit:'11.9 年', rotation:'9.9 小时', moons:'95', distance:'5.20 AU', temp:'-108°C' } },
    { name:'土星', en:'Saturn', radius:2.6, distance:76.0, speed:0.97, color:0xe8d7a5, rotSpeed:0.018, tilt:0.466, hasRing:true,
      moons:[
        { name:'土卫六·泰坦', radius:0.38, dist:7.0, speed:1.8 },{ name:'土卫五·瑞亚', radius:0.22, dist:5.0, speed:2.4 },
        { name:'土卫四·狄俄涅', radius:0.18, dist:4.0, speed:3.1 },{ name:'土卫三·忒提斯', radius:0.16, dist:3.2, speed:3.8 }
      ],
      info:{ diameter:'116,460 km', mass:'5.68×10²⁶ kg', orbit:'29.5 年', rotation:'10.7 小时', moons:'146', distance:'9.58 AU', temp:'-138°C' } },
    { name:'天王星', en:'Uranus', radius:1.9, distance:101.5, speed:0.68, color:0x9ed9e0, rotSpeed:-0.012, tilt:1.706,
      moons:[{ name:'天卫三·泰坦尼亚', radius:0.28, dist:4.2, speed:2.2 },{ name:'天卫四·奥伯龙', radius:0.25, dist:5.6, speed:1.7 }],
      info:{ diameter:'50,724 km', mass:'8.68×10²⁵ kg', orbit:'84 年', rotation:'17.2 小时', moons:'28', distance:'19.2 AU', temp:'-197°C' } },
    { name:'海王星', en:'Neptune', radius:1.85, distance:126.5, speed:0.54, color:0x3f66cc, rotSpeed:0.011, tilt:0.494,
      moons:[{ name:'海卫一·崔顿', radius:0.26, dist:4.2, speed:-2.1 },{ name:'海卫二·涅瑞伊得', radius:0.12, dist:6.8, speed:0.8 }],
      info:{ diameter:'49,244 km', mass:'1.02×10²⁶ kg', orbit:'165 年', rotation:'16 小时', moons:'16', distance:'30.1 AU', temp:'-201°C' } }
  ];

  // ---------- 初始化场景 ----------
  const canvas = document.getElementById('glcanvas');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x010114, 1);
  renderer.toneMapping = THREE.ReinhardToneMapping;
  renderer.toneMappingExposure = 1.3;
  renderer.shadowMap.enabled = false;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x010114);
  scene.fog = new THREE.FogExp2(0x010114, 0.0002);

  const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.3, 3500);
  camera.position.set(0, 45, 185);
  camera.lookAt(0, 0, 0);

  // 轨道控制 (支持超近缩放 + 触摸双指缩放)
  class OrbitCtrl {
    constructor(cam, dom) {
      this.cam = cam; this.dom = dom;
      this.target = new THREE.Vector3(0,0,0);
      this.radius = cam.position.length();
      this.theta = Math.atan2(cam.position.z, cam.position.x);
      this.phi = Math.acos(Math.min(0.99, Math.max(-0.99, cam.position.y / this.radius)));
      this.rotSpeed = 0.008; 
      this.zoomSpeed = 0.04;
      this.dragging = false; 
      this.lastPos = {x:0,y:0};
      this.minRadius = 2.8;    
      this.maxRadius = 520;
      this.minPhi = 0.12; this.maxPhi = Math.PI - 0.12;
      
      // 触摸双指缩放相关
      this.touchZoomActive = false;
      this.initialTouchDistance = 0;
      this.initialRadius = 0;
      
      this._updateCam();
      this.bindEvents();
    }
    _updateCam() {
      const x = this.radius * Math.sin(this.phi) * Math.cos(this.theta);
      const y = this.radius * Math.cos(this.phi);
      const z = this.radius * Math.sin(this.phi) * Math.sin(this.theta);
      this.cam.position.set(x + this.target.x, y + this.target.y, z + this.target.z);
      this.cam.lookAt(this.target);
      // 同步外部滑块值
      const slider = document.getElementById('zoom-slider');
      if(slider && !slider._isUpdating) {
        slider.value = this.radius;
      }
    }
    bindEvents() {
      // 鼠标事件
      this.dom.addEventListener('mousedown', (e) => { if(e.button===0){ this.dragging=true; this.lastPos={x:e.clientX,y:e.clientY}; e.preventDefault(); } });
      window.addEventListener('mousemove', (e) => {
        if(!this.dragging) return;
        const dx = e.clientX - this.lastPos.x, dy = e.clientY - this.lastPos.y;
        this.theta += dx * this.rotSpeed;
        this.phi += dy * this.rotSpeed;
        this.phi = Math.min(this.maxPhi, Math.max(this.minPhi, this.phi));
        this._updateCam();
        this.lastPos = {x:e.clientX, y:e.clientY};
      });
      window.addEventListener('mouseup', () => { this.dragging = false; });
      this.dom.addEventListener('wheel', (e) => {
        e.preventDefault();
        this.radius -= e.deltaY * this.zoomSpeed;
        this.radius = Math.min(this.maxRadius, Math.max(this.minRadius, this.radius));
        this._updateCam();
      }, { passive: false });
      
      // 触摸事件：单指旋转，双指缩放
      this.dom.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if(e.touches.length === 1) {
          this.dragging = true;
          this.lastPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        } else if(e.touches.length === 2) {
          this.touchZoomActive = true;
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          this.initialTouchDistance = Math.hypot(dx, dy);
          this.initialRadius = this.radius;
          this.dragging = false;
        }
      });
      this.dom.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if(this.touchZoomActive && e.touches.length === 2) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          const newDistance = Math.hypot(dx, dy);
          const scale = newDistance / this.initialTouchDistance;
          let newRadius = this.initialRadius / scale;
          newRadius = Math.min(this.maxRadius, Math.max(this.minRadius, newRadius));
          if(!isNaN(newRadius)) this.radius = newRadius;
          this._updateCam();
        } else if(this.dragging && e.touches.length === 1) {
          const dx = e.touches[0].clientX - this.lastPos.x;
          const dy = e.touches[0].clientY - this.lastPos.y;
          this.theta += dx * this.rotSpeed;
          this.phi += dy * this.rotSpeed;
          this.phi = Math.min(this.maxPhi, Math.max(this.minPhi, this.phi));
          this._updateCam();
          this.lastPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }
      });
      this.dom.addEventListener('touchend', (e) => {
        e.preventDefault();
        this.dragging = false;
        this.touchZoomActive = false;
      });
    }
    setTarget(pos) {
      const oldOffset = new THREE.Vector3().subVectors(this.cam.position, this.target);
      this.target.copy(pos);
      this.cam.position.copy(pos.clone().add(oldOffset));
      const newRadius = this.cam.position.distanceTo(this.target);
      this.radius = newRadius;
      this.theta = Math.atan2(this.cam.position.z - pos.z, this.cam.position.x - pos.x);
      this.phi = Math.acos(Math.min(0.99, Math.max(-0.99, (this.cam.position.y - pos.y) / this.radius)));
      this._updateCam();
    }
    reset() {
      this.target.set(0,0,0);
      this.radius = 175; this.theta = 0.8; this.phi = 0.45;
      this._updateCam();
    }
  }
  const orbitControl = new OrbitCtrl(camera, canvas);
  
  // 单独处理缩放滑块事件 (不破坏原有逻辑)
  const zoomSlider = document.getElementById('zoom-slider');
  zoomSlider.addEventListener('input', (e) => {
    const val = parseFloat(e.target.value);
    if(!isNaN(val)) {
      orbitControl.radius = Math.min(orbitControl.maxRadius, Math.max(orbitControl.minRadius, val));
      orbitControl._updateCam();
      // 防止滑块触发时再次同步导致死循环，已用 _isUpdating 标志避免
    }
  });

  // ----- 星空背景 -----
  const starGeo = new THREE.BufferGeometry();
  const starPos = [];
  for(let i=0;i<5500;i++) {
    const r = 700 + Math.random() * 600;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    starPos.push(r * Math.sin(phi) * Math.cos(theta), r * Math.sin(phi) * Math.sin(theta), r * Math.cos(phi));
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(starPos), 3));
  scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.65, transparent: true, opacity: 0.8 })));
  
  const starGeo2 = new THREE.BufferGeometry();
  const starPos2 = [];
  for(let i=0;i<3000;i++) { starPos2.push((Math.random()-0.5)*1800, (Math.random()-0.5)*1200, (Math.random()-0.5)*1000-300); }
  starGeo2.setAttribute('position', new THREE.BufferAttribute(new Float32Array(starPos2), 3));
  scene.add(new THREE.Points(starGeo2, new THREE.PointsMaterial({ color: 0xaaccff, size: 0.3, transparent: true, opacity: 0.6 })));

  // 太阳 + 增强光照
  const sunMat = new THREE.MeshStandardMaterial({ color: 0xffaa55, emissive: 0xff6611, emissiveIntensity: 1.5 });
  const sunMesh = new THREE.Mesh(new THREE.SphereGeometry(6.5, 128, 128), sunMat);
  scene.add(sunMesh);
  const sunLight = new THREE.PointLight(0xffaa66, 2.2, 550);
  sunLight.position.set(0,0,0);
  scene.add(sunLight);
  const ambientLight = new THREE.AmbientLight(0x333344);
  scene.add(ambientLight);
  const mainDirLight = new THREE.DirectionalLight(0xffeedd, 1.0);
  mainDirLight.position.set(8, 20, 5);
  scene.add(mainDirLight);
  const fillLight = new THREE.DirectionalLight(0x88aaff, 0.6);
  fillLight.position.set(-3, 5, 8);
  scene.add(fillLight);
  const backFill = new THREE.PointLight(0x88aacc, 0.5);
  backFill.position.set(-10, 5, -15);
  scene.add(backFill);
  
  const glowMat = new THREE.MeshBasicMaterial({ color: 0xff8844, transparent: true, opacity: 0.12, side: THREE.BackSide });
  const sunGlow = new THREE.Mesh(new THREE.SphereGeometry(7.4, 48, 48), glowMat);
  sunMesh.add(sunGlow);
  
  // 纹理加载器 (地球高精度)
  const loader = new THREE.TextureLoader();
  const earthMap = loader.load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg');
  const earthNormalMap = loader.load('https://threejs.org/examples/textures/planets/earth_normal_2048.jpg');
  const earthSpecularMap = loader.load('https://threejs.org/examples/textures/planets/earth_specular_2048.jpg');
  const cloudMap = loader.load('https://threejs.org/examples/textures/planets/earth_clouds_1024.png');
  
  function makeSimpleTexture(baseColor) {
    const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 512;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = `#${(baseColor & 0xffffff).toString(16).padStart(6,'0')}`;
    ctx.fillRect(0,0,512,512);
    for(let i=0;i<800;i++) { ctx.fillStyle = `rgba(0,0,0,${Math.random()*0.3})`; ctx.fillRect(Math.floor(Math.random()*512), Math.floor(Math.random()*512), 2, 2); }
    return new THREE.CanvasTexture(canvas);
  }
  
  // 透明文字标签 (已有)
  function createTransparentLabel(title, subtitle, fontSize = 24, subFontSize = 14) {
    const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 128;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.font = `Bold ${fontSize}px "Microsoft YaHei", "Segoe UI"`;
    ctx.textAlign = 'center';
    ctx.shadowBlur = 8;
    ctx.shadowColor = 'rgba(0,0,0,0.9)';
    ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2;
    ctx.strokeStyle = 'rgba(0,0,0,0.8)'; ctx.lineWidth = 3;
    ctx.fillStyle = '#ffffff';
    ctx.strokeText(title, canvas.width/2, 48);
    ctx.fillText(title, canvas.width/2, 48);
    if(subtitle) {
      ctx.font = `${subFontSize}px "Segoe UI", monospace`;
      ctx.fillStyle = '#cceeff';
      ctx.strokeStyle = 'rgba(0,0,0,0.7)';
      ctx.lineWidth = 2;
      ctx.strokeText(subtitle, canvas.width/2, 80);
      ctx.fillText(subtitle, canvas.width/2, 80);
    }
    ctx.shadowBlur = 0;
    return new THREE.CanvasTexture(canvas);
  }
  function createMoonLabel(name) {
    const canvas = document.createElement('canvas'); canvas.width = 360; canvas.height = 80;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.font = '16px "Microsoft YaHei", "Segoe UI"';
    ctx.textAlign = 'center';
    ctx.shadowBlur = 6;
    ctx.shadowColor = 'rgba(0,0,0,0.8)';
    ctx.fillStyle = '#f0fcff';
    ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.lineWidth = 2;
    ctx.strokeText(name, canvas.width/2, 38);
    ctx.fillText(name, canvas.width/2, 38);
    ctx.shadowBlur = 0;
    return new THREE.CanvasTexture(canvas);
  }
  
  const planetPivots = [], planetMeshes = [];
  const moonsList = [];
  const orbits = [];
  
  function addOrbitLine(radius) {
    const points = [];
    for(let i=0;i<=128;i++) { let a = (i/128)*Math.PI*2; points.push(new THREE.Vector3(radius*Math.cos(a),0,radius*Math.sin(a))); }
    const line = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(points), new THREE.LineBasicMaterial({ color: 0x4a7aac, transparent: true, opacity: 0.32 }));
    scene.add(line);
    return line;
  }
  
  PLANETS.forEach((p, idx) => {
    const orbitLine = addOrbitLine(p.distance);
    orbits.push(orbitLine);
    const pivot = new THREE.Object3D();
    scene.add(pivot);
    planetPivots.push(pivot);
    
    let planetMesh;
    if(p.name === '地球') {
      const earthMat = new THREE.MeshStandardMaterial({
        map: earthMap,
        normalMap: earthNormalMap,
        specularMap: earthSpecularMap,
        roughness: 0.45,
        metalness: 0.12,
        shininess: 35,
        emissive: new THREE.Color(0x114477),
        emissiveIntensity: 0.18
      });
      const geometry = new THREE.SphereGeometry(p.radius, 128, 128);
      planetMesh = new THREE.Mesh(geometry, earthMat);
      planetMesh.position.set(p.distance, 0, 0);
      planetMesh.rotation.z = p.tilt;
      pivot.add(planetMesh);
      
      const cloudGeo = new THREE.SphereGeometry(p.radius + 0.02, 128, 128);
      const cloudMat = new THREE.MeshPhongMaterial({ map: cloudMap, transparent: true, opacity: 0.28, blending: THREE.AdditiveBlending, side: THREE.DoubleSide });
      const clouds = new THREE.Mesh(cloudGeo, cloudMat);
      planetMesh.add(clouds);
      planetMesh.userData = { clouds: clouds, cloudSpeed: 0.012 };
      
      const atmoGeo = new THREE.SphereGeometry(p.radius + 0.12, 96, 96);
      const atmoMat = new THREE.MeshPhongMaterial({ color: 0x88aaff, emissive: 0x224466, transparent: true, opacity: 0.19, side: THREE.BackSide });
      const atmosphere = new THREE.Mesh(atmoGeo, atmoMat);
      planetMesh.add(atmosphere);
      
      const glowOuterGeo = new THREE.SphereGeometry(p.radius + 0.2, 64, 64);
      const glowOuterMat = new THREE.MeshBasicMaterial({ color: 0x88aaff, transparent: true, opacity: 0.1, side: THREE.BackSide, depthWrite: false });
      const outerGlow = new THREE.Mesh(glowOuterGeo, glowOuterMat);
      planetMesh.add(outerGlow);
    } else {
      const material = new THREE.MeshStandardMaterial({ map: makeSimpleTexture(p.color), roughness: 0.7, metalness: 0.05 });
      const geometry = new THREE.SphereGeometry(p.radius, 64, 64);
      planetMesh = new THREE.Mesh(geometry, material);
      planetMesh.position.set(p.distance, 0, 0);
      planetMesh.rotation.z = p.tilt;
      pivot.add(planetMesh);
    }
    
    planetMesh.userData.planetIdx = idx;
    planetMesh.userData.name = p.name;
    planetMeshes.push(planetMesh);
    
    const labelTexture = createTransparentLabel(p.name, p.en, 24, 14);
    const spriteMat = new THREE.SpriteMaterial({ map: labelTexture, transparent: true, depthTest: false });
    const labelSprite = new THREE.Sprite(spriteMat);
    labelSprite.scale.set(5.6, 2.2, 1);
    labelSprite.position.y = p.radius + 1.9;
    planetMesh.add(labelSprite);
    
    if(p.hasRing && p.name === '土星') {
      const ringGeo = new THREE.RingGeometry(p.radius*1.3, p.radius*2.7, 96);
      const ringMat = new THREE.MeshPhongMaterial({ color: 0xcbba7a, side: THREE.DoubleSide, transparent: true, opacity: 0.7, emissive: 0x331c00 });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.rotation.x = Math.PI / 2.2;
      planetMesh.add(ring);
    }
    
    if(p.moons && p.moons.length) {
      p.moons.forEach((m, mi) => {
        const moonPivot = new THREE.Object3D();
        planetMesh.add(moonPivot);
        const moonMat = new THREE.MeshStandardMaterial({ color: m.color || 0xccaa88, roughness: 0.7 });
        const moonSphere = new THREE.Mesh(new THREE.SphereGeometry(m.radius, 48, 48), moonMat);
        moonSphere.position.set(m.dist, 0, 0);
        moonPivot.add(moonSphere);
        const moonLabelTex = createMoonLabel(m.name.split('·')[0]);
        const msprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: moonLabelTex, transparent: true, depthTest: false }));
        msprite.scale.set(3.2, 1.1, 1);
        msprite.position.y = m.radius + 0.7;
        moonSphere.add(msprite);
        moonsList.push({
          pivot: moonPivot, mesh: moonSphere, parentIdx: idx, speed: m.speed, angle: Math.random()*Math.PI*2, dist: m.dist, name: m.name
        });
      });
    }
  });
  
  const astCount = 3200, astPos = [];
  for(let i=0;i<astCount;i++) { let r = 38+Math.random()*11, ang = Math.random()*Math.PI*2, yoff = (Math.random()-0.5)*2.2; astPos.push(r*Math.cos(ang), yoff, r*Math.sin(ang)); }
  const asteroidField = new THREE.Points(new THREE.BufferGeometry(), new THREE.PointsMaterial({ color: 0xaa9977, size: 0.19 }));
  asteroidField.geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(astPos), 3));
  scene.add(asteroidField);
  
  // ------------------- 无抖动公转 -------------------
  let animationStartTime = performance.now() / 1000;
  let pausedTimeOffset = 0;
  const initAngles = PLANETS.map(() => Math.random() * Math.PI * 2);
  const moonInitAngles = moonsList.map(() => Math.random() * Math.PI * 2);
  const BASE_SPEED_FACTOR = 0.065;
  
  function updateOrbitAngles(currentTimeSec, speedMult, isPaused) {
    if (!isPaused) {
      const effectiveTime = (currentTimeSec - animationStartTime) + pausedTimeOffset;
      PLANETS.forEach((p, idx) => {
        const angle = initAngles[idx] + p.speed * BASE_SPEED_FACTOR * speedMult * effectiveTime;
        planetPivots[idx].rotation.y = angle;
      });
      moonsList.forEach((m, idx) => {
        const angle = moonInitAngles[idx] + m.speed * BASE_SPEED_FACTOR * 1.3 * speedMult * effectiveTime;
        m.pivot.rotation.y = angle;
      });
    }
  }
  
  // UI 交互 (保持不变)
  const planetsContainer = document.getElementById('planet-list-container');
  const moonsContainer = document.getElementById('moon-list-container');
  const infoCard = document.getElementById('info-card');
  const closeInfo = document.getElementById('info-card-close');
  closeInfo.onclick = () => { infoCard.style.display = 'none'; followPlanetIdx = null; };
  function showPlanetInfo(idx) {
    const p = PLANETS[idx];
    document.getElementById('ic-name').innerText = p.name; document.getElementById('ic-en').innerText = p.en;
    document.getElementById('ic-diameter').innerText = p.info.diameter; document.getElementById('ic-mass').innerText = p.info.mass;
    document.getElementById('ic-orbit').innerText = p.info.orbit; document.getElementById('ic-rotation').innerText = p.info.rotation;
    document.getElementById('ic-moons').innerText = p.info.moons; document.getElementById('ic-distance').innerText = p.info.distance;
    document.getElementById('ic-temp').innerText = p.info.temp;
    infoCard.style.display = 'block';
  }
  function showSunInfo(){
    document.getElementById('ic-name').innerHTML = '太阳'; document.getElementById('ic-en').innerHTML = 'The Sun';
    document.getElementById('ic-diameter').innerHTML = '1,392,700 km'; document.getElementById('ic-mass').innerHTML = '1.99×10³⁰ kg';
    document.getElementById('ic-orbit').innerHTML = '约 2.26 亿年'; document.getElementById('ic-rotation').innerHTML = '约 25 天';
    document.getElementById('ic-moons').innerHTML = '8 大行星'; document.getElementById('ic-distance').innerHTML = '中心'; document.getElementById('ic-temp').innerHTML = '5,500°C';
    infoCard.style.display = 'block';
  }
  function showMoonInfo(moon){
    document.getElementById('ic-name').innerHTML = moon.name.split('·')[0]; document.getElementById('ic-en').innerHTML = '天然卫星';
    document.getElementById('ic-diameter').innerHTML = '～数百千米'; document.getElementById('ic-mass').innerHTML = '—'; document.getElementById('ic-orbit').innerHTML = '数天'; 
    document.getElementById('ic-rotation').innerHTML = '同步自转'; document.getElementById('ic-moons').innerHTML = '—'; document.getElementById('ic-distance').innerHTML = `${moon.dist} 万km`; document.getElementById('ic-temp').innerHTML = '-170 ~ -30°C';
    infoCard.style.display = 'block';
  }
  let followPlanetIdx = null;
  function followPlanet(idx) {
    if(idx === null) { orbitControl.target.set(0,0,0); followPlanetIdx = null; return; }
    const worldPos = planetMeshes[idx].getWorldPosition(new THREE.Vector3());
    orbitControl.setTarget(worldPos);
    followPlanetIdx = idx;
  }
  
  const btnsAll = [];
  const sunBtn = document.createElement('div'); sunBtn.className = 'planet-btn'; sunBtn.innerText = '☀️ 太阳';
  sunBtn.onclick = () => { followPlanet(null); showSunInfo(); clearActive(); sunBtn.classList.add('active'); followPlanetIdx = null; };
  planetsContainer.appendChild(sunBtn); btnsAll.push(sunBtn);
  PLANETS.forEach((p, idx) => {
    const btn = document.createElement('div'); btn.className = 'planet-btn'; btn.innerText = p.name;
    btn.onclick = () => { followPlanet(idx); showPlanetInfo(idx); clearActive(); btn.classList.add('active'); };
    planetsContainer.appendChild(btn); btnsAll.push(btn);
  });
  moonsList.forEach((m) => {
    const parentPlanet = PLANETS[m.parentIdx].name;
    const moonBtn = document.createElement('div'); moonBtn.className = 'moon-item'; moonBtn.innerText = `🪐 ${m.name.split('·')[0]} (${parentPlanet})`;
    moonBtn.onclick = () => { followPlanet(m.parentIdx); showMoonInfo(m); clearActive(); moonBtn.classList.add('active'); };
    moonsContainer.appendChild(moonBtn);
    btnsAll.push(moonBtn);
  });
  function clearActive() { btnsAll.forEach(el => el.classList.remove('active')); }
  
  const speedSlider = document.getElementById('speed-slider');
  const speedVal = document.getElementById('speed-val');
  const pauseBtn = document.getElementById('btn-pause');
  const resetBtn = document.getElementById('btn-reset');
  const btn2d = document.getElementById('btn-2d-mode');
  
  let speedMulti = 1.2;
  let paused = false;
  let is2DMode = false;
  
  speedSlider.addEventListener('input', (e) => { 
    speedMulti = parseFloat(e.target.value); 
    speedVal.innerText = speedMulti.toFixed(2)+'x';
  });
  pauseBtn.addEventListener('click', () => {
    paused = !paused;
    pauseBtn.innerText = paused ? '▶ 播放' : '⏸ 暂停';
    const now = performance.now() / 1000;
    if(paused) {
      const effectiveTime = (now - animationStartTime) + pausedTimeOffset;
      pausedTimeOffset = effectiveTime;
      animationStartTime = now;
    } else {
      animationStartTime = now;
    }
  });
  resetBtn.addEventListener('click', () => { 
    orbitControl.reset(); 
    followPlanetIdx = null; 
    clearActive(); 
    if(is2DMode) set2DMode(true); 
    else set2DMode(false);
    const now = performance.now() / 1000;
    pausedTimeOffset = 0;
    animationStartTime = now;
  });
  
  function set2DMode(enable) {
    is2DMode = enable;
    if(enable) {
      orbits.forEach(line => line.visible = false);
      asteroidField.visible = false;
      orbitControl.target.set(0,0,0);
      camera.position.set(0, 28, 220);
      orbitControl.radius = camera.position.length();
      orbitControl.theta = Math.atan2(camera.position.z, camera.position.x);
      orbitControl.phi = Math.acos(Math.min(0.99, Math.max(-0.99, camera.position.y / orbitControl.radius)));
      orbitControl._updateCam();
      for(let i=0;i<PLANETS.length;i++) {
        planetPivots[i].rotation.y = 0;
        planetMeshes[i].position.set(PLANETS[i].distance, 0, 0);
      }
      moonsList.forEach(m => { m.pivot.rotation.y = 0; });
    } else {
      orbits.forEach(line => line.visible = true);
      asteroidField.visible = true;
      const now = performance.now() / 1000;
      pausedTimeOffset = 0;
      animationStartTime = now;
      for(let i=0;i<PLANETS.length;i++) initAngles[i] = Math.random() * Math.PI * 2;
      for(let i=0;i<moonsList.length;i++) moonInitAngles[i] = Math.random() * Math.PI * 2;
    }
  }
  btn2d.addEventListener('click', () => {
    is2DMode = !is2DMode;
    set2DMode(is2DMode);
    btn2d.innerText = is2DMode ? '🌐 3D环形视图' : '📐 2D直线视图';
    if(is2DMode) followPlanetIdx = null;
    else orbitControl.reset();
  });
  
  const raycaster = new THREE.Raycaster();
  const mouseVec = new THREE.Vector2();
  canvas.addEventListener('click', (e) => {
    mouseVec.x = (e.clientX / canvas.clientWidth) * 2 - 1;
    mouseVec.y = -(e.clientY / canvas.clientHeight) * 2 + 1;
    raycaster.setFromCamera(mouseVec, camera);
    const intersects = raycaster.intersectObjects(planetMeshes);
    if(intersects.length) {
      let obj = intersects[0].object;
      while(obj && obj.userData.planetIdx === undefined) obj = obj.parent;
      if(obj && obj.userData.planetIdx !== undefined) {
        const idx = obj.userData.planetIdx;
        followPlanet(idx); showPlanetInfo(idx); clearActive(); if(btnsAll[idx+1]) btnsAll[idx+1].classList.add('active');
        return;
      }
    }
    const sunHit = raycaster.intersectObject(sunMesh);
    if(sunHit.length) { followPlanet(null); showSunInfo(); clearActive(); sunBtn.classList.add('active'); }
  });
  
  let lastTimestamp = 0;
  function animate(nowMs) {
    requestAnimationFrame(animate);
    const nowSec = nowMs / 1000;
    if (!is2DMode) {
      if (!paused) updateOrbitAngles(nowSec, speedMulti, false);
    }
    const dt = Math.min(0.033, (nowMs - lastTimestamp) / 1000);
    if(dt > 0 && !paused) {
      const rotFactor = speedMulti * dt * 30;
      PLANETS.forEach((p,i) => { planetMeshes[i].rotation.y += p.rotSpeed * rotFactor; });
      const earthMesh = planetMeshes.find(m => m.userData.name === '地球');
      if(earthMesh && earthMesh.userData.clouds) {
        earthMesh.userData.clouds.rotation.y += 0.012 * speedMulti * dt;
      }
      sunMesh.rotation.y += 0.005 * dt * 40;
    }
    if(followPlanetIdx !== null && planetMeshes[followPlanetIdx]) {
      const worldPos = planetMeshes[followPlanetIdx].getWorldPosition(new THREE.Vector3());
      orbitControl.target.lerp(worldPos, 0.12);
      orbitControl._updateCam();
    }
    renderer.render(scene, camera);
    lastTimestamp = nowMs;
  }
  
  animationStartTime = performance.now() / 1000;
  pausedTimeOffset = 0;
  requestAnimationFrame(animate);
  
  setTimeout(() => { document.getElementById('loading').style.display = 'none'; }, 1000);
  window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
})();
</script>
</body>
</html>
